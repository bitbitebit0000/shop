<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropFit - 로그인</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --sub-text: #6c757d;
            --border: #e9ecef;
            --accent: #111827;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

        /* Header */
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 900; color: var(--accent); text-decoration: none; letter-spacing: -0.5px; }
        nav a { margin-left: 1rem; text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 500; }

        /* Login Container */
        .login-wrapper { max-width: 420px; width: 100%; margin: 4rem auto; padding: 0 1rem; }
        .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .login-title { font-size: 1.4rem; font-weight: bold; text-align: center; margin-bottom: 0.5rem; }
        .login-subtitle { font-size: 0.85rem; color: var(--sub-text); text-align: center; margin-bottom: 1.5rem; }

        /* Error Alert Box */
        .alert-error {
            background-color: var(--danger-bg);
            border: 1px solid #fecaca;
            color: var(--danger);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            text-align: center;
        }

        /* Form Controls */
        .form-group { margin-bottom: 1.2rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.4rem; color: var(--text); }
        .form-input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: var(--accent); }

        /* Buttons */
        .btn-login { width: 100%; padding: 0.75rem; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
        .btn-login:hover { background: #1f2937; }

        /* Footer Links */
        .login-footer { margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--sub-text); }
        .login-footer a { color: var(--accent); text-decoration: none; font-weight: bold; margin-left: 0.3rem; }
        .login-footer a:hover { text-decoration: underline; }

        /* Footer */
        footer { text-align: center; padding: 2rem; color: var(--sub-text); border-top: 1px solid var(--border); font-size: 0.85rem; }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <a href="/" class="logo">DropFit</a>
    <nav>
        <a href="/items">상품목록</a>
        <!-- 동적 세션 메인 메뉴 -->
        <a th:if="${session.loginMember != null}" href="/mypage" style="font-weight: bold; color: var(--accent);">마이페이지</a>
        <a th:if="${session.loginMember != null}" href="/logout">로그아웃</a>
        <a th:if="${session.loginMember == null}" href="/sign-up">회원가입</a>
    </nav>
</header>

<!-- Main Content -->
<main class="login-wrapper">
    <div class="login-card">
        <h1 class="login-title">로그인</h1>
        <p class="login-subtitle">DropFit 서비스 이용을 위해 로그인해주세요.</p>

        <!-- 컨트롤러에서 넘겨준 loginError 메시지 출력 -->
        <div th:if="${loginError}" class="alert-error" th:text="${loginError}">
            아이디 또는 비밀번호가 맞지 않습니다.
        </div>

        <!-- th:object를 통해 LoginForm 객체 바인딩 -->
        <form th:action="@{/login}" th:object="${loginForm}" method="post">
            <div class="form-group">
                <label for="email" class="form-label">이메일</label>
                <input type="email" id="email" th:field="*{email}" class="form-input" placeholder="이메일을 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" class="form-input" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="btn-login">로그인</button>
        </form>

        <div class="login-footer">
            계정이 없으신가요? <a href="/sign-up">회원가입</a>
        </div>
    </div>
</main>

<!-- Standardized Footer -->
<footer>
    <p>© 2026 <strong>DropFit</strong>. All rights reserved.</p>
    <p style="font-size: 0.8rem; color: var(--sub-text); margin-top: 0.25rem;">
        Powered by Spring Boot, Spring Data JPA, Thymeleaf & MySQL
    </p>
</footer>

</body>
</html>
