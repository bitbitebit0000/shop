<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        .container { max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .error-message { color: red; font-size: 0.9em; margin-bottom: 15px; }
        .btn { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>로그인</h2>

    <!-- 컨트롤러에서 넘겨준 loginError 메시지 출력 -->
    <div th:if="${loginError}" class="error-message" th:text="${loginError}">
        아이디 또는 비밀번호가 맞지 않습니다.
    </div>

    <!-- th:object를 통해 LoginForm 객체 바인딩 -->
    <form th:action="@{/login}" th:object="${loginForm}" method="post">
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" th:field="*{email}" placeholder="이메일을 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" placeholder="비밀번호를 입력하세요" required>
        </div>

        <button type="submit" class="btn">로그인</button>
    </form>
</div>

</body>
</html>
