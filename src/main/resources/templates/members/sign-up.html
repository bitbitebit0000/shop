<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceLab - 회원가입</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --sub-text: #6c757d;
            --border: #e9ecef;
            --accent: #2563eb;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

        /* Header */
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: bold; color: var(--accent); text-decoration: none; }
        nav a { margin-left: 1rem; text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 500; }

        /* Signup Container */
        .signup-wrapper { max-width: 480px; width: 100%; margin: 3rem auto; padding: 0 1rem; }
        .signup-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .signup-title { font-size: 1.4rem; font-weight: bold; text-align: center; margin-bottom: 0.5rem; }
        .signup-subtitle { font-size: 0.85rem; color: var(--sub-text); text-align: center; margin-bottom: 1.5rem; }

        /* Error Alert Box */
        .alert-error {
            background-color: var(--danger-bg);
            border: 1px solid #fecaca;
            color: var(--danger);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            text-align: center;
        }

        /* Form Controls */
        .form-group { margin-bottom: 1.2rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.4rem; color: var(--text); }
        .form-input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: var(--accent); }

        /* Address Group Inline Layout */
        .address-group { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }

        /* Buttons */
        .btn-signup { width: 100%; padding: 0.75rem; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
        .btn-signup:hover { background: #1d4ed8; }

        /* Footer Links */
        .signup-footer { margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--sub-text); }
        .signup-footer a { color: var(--accent); text-decoration: none; font-weight: 500; margin-left: 0.3rem; }
        .signup-footer a:hover { text-decoration: underline; }

        /* Footer */
        footer { text-align: center; padding: 2rem; color: var(--sub-text); border-top: 1px solid var(--border); font-size: 0.85rem; }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <a href="/" class="logo">CommerceLab</a>
    <nav>
        <a href="/items">상품목록</a>
        <a href="/orders">주문조회</a>
        <a href="/cart">장바구니</a>

        <!-- 동적 세션 메인 메뉴 -->
        <a th:if="${session.loginMember != null}" href="/mypage" style="font-weight: bold; color: var(--accent);">마이페이지</a>
        <a th:if="${session.loginMember != null}" href="/logout">로그아웃</a>
        <a th:if="${session.loginMember == null}" href="/login">로그인</a>
    </nav>
</header>

<!-- Main Content -->
<main class="signup-wrapper">
    <div class="signup-card">
        <h1 class="signup-title">회원가입</h1>
        <p class="signup-subtitle">CommerceLab의 회원이 되어 다양한 서비스를 이용해보세요.</p>

        <!-- 중복 회원 등 예외 발생 시에만 상단에 팝업 -->
        <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

        <form action="/sign-up" method="post" th:object="${memberForm}">
            <!-- 이름 -->
            <div class="form-group">
                <label for="name" class="form-label">이름</label>
                <input type="text" id="name" th:field="*{name}" class="form-input" placeholder="홍길동" required>
            </div>

            <!-- 이메일 (아이디) -->
            <div class="form-group">
                <label for="email" class="form-label">이메일 (아이디)</label>
                <input type="email" id="email" th:field="*{email}" class="form-input" placeholder="example@commercelab.com" required>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" class="form-input" placeholder="비밀번호를 입력하세요" required>
            </div>

            <!-- 주소 정보 -->
            <div class="form-group">
                <label class="form-label">주소</label>
                <div class="address-group">
                    <input type="text" th:field="*{city}" class="form-input" placeholder="도시 (예: 서울시)">
                    <input type="text" th:field="*{street}" class="form-input" placeholder="거리 (예: 테헤란로 123)">
                </div>
                <input type="text" th:field="*{zipcode}" class="form-input" placeholder="우편번호 (예: 06123)">
            </div>

            <button type="submit" class="btn-signup">가입하기</button>
        </form>

        <div class="signup-footer">
            이미 계정이 있으신가요? <a href="/login">로그인</a>
        </div>
    </div>
</main>

<!-- Standardized Footer -->
<footer>
    <p>© 2026 <strong>CommerceLab</strong>. All rights reserved.</p>
    <p style="font-size: 0.8rem; color: var(--sub-text); margin-top: 0.25rem;">
        Powered by Spring Boot, Spring Data JPA, Thymeleaf & MySQL
    </p>
</footer>

</body>
</html>
