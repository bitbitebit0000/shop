<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropFit - Payment Cancelled</title>

    <link rel="stylesheet" th:href="@{/css/order/cancel.css}">
</head>
<body>

<main class="cancel-wrapper">
    <div class="cancel-card">
        <h2 class="title">⚠️ Payment Cancelled</h2>
        <p class="desc">
            The payment process was interrupted by the user.<br>
            Please review your order details and try again.
        </p>

        <div class="btn-group">
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
            <a th:href="@{/}" class="btn btn-primary">Back to Home</a>
        </div>
    </div>
</main>

</body>
</html>
