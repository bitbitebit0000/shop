<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문하기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 600px;">
    <h2 class="mb-4 text-center">상품 주문 작성</h2>

    <!-- 백엔드 예외 발생 시 메시지 출력 (추가된 부분) -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">재고가 부족합니다.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- [1단계] 상품 선택 폼 (GET 방식) -->
    <form th:action="@{/order}" method="get" class="mb-3">
        <div class="mb-3">
            <label for="itemSelect" class="form-label fw-bold">1. 상품 선택</label>
            <select id="itemSelect" name="itemId" class="form-select" onchange="this.form.submit()">
                <option value="" disabled th:selected="${selectedItemId == null}">-- 상품을 선택해 주세요 --</option>
                <option th:each="item : ${items}"
                        th:value="${item.id}"
                        th:text="${item.name} + ' (' + ${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원)'"
                        th:selected="${item.id == selectedItemId}">
                </option>
            </select>
        </div>
    </form>

    <!-- [2단계] 결제 확인 페이지로 이동 폼 (POST /order/checkout) -->
    <form id="orderForm" th:action="@{/order/checkout}" method="post" onsubmit="return validateStock()">
        <!-- 선택된 itemId 숨겨서 전달 -->
        <input type="hidden" name="itemId" th:value="${selectedItemId}">

        <!-- 주문자 정보 -->
        <div class="mb-3">
            <label for="memberName" class="form-label fw-bold">주문자 성함</label>
            <input type="text" id="memberName" name="memberName" class="form-control"
                   th:value="${loginMember != null ? loginMember.name : ''}" readonly required>
        </div>

        <!-- 2. 옵션/사이즈 선택 -->
        <div class="mb-3">
            <label for="optionSelect" class="form-label fw-bold">2. 사이즈/옵션 선택</label>

            <!-- 상품 선택 전 -->
            <select id="optionSelect" name="itemOptionId" class="form-select" th:if="${options == null}" disabled required>
                <option value="" selected disabled>-- 먼저 위에서 상품을 선택해 주세요 --</option>
            </select>

            <!-- 상품 선택 후: data-stock 속성에 재고 수량 저장 -->
            <select id="optionSelect" name="itemOptionId" class="form-select" th:if="${options != null}" required onchange="updateMaxStock()">
                <option value="" selected disabled data-stock="0">-- 사이즈를 선택해 주세요 --</option>
                <option th:each="opt : ${options}"
                        th:value="${opt.id}"
                        th:data-stock="${opt.stockQuantity}"
                        th:disabled="${opt.stockQuantity == 0}"
                        th:text="${opt.size} + (${opt.stockQuantity == 0} ? ' [품절]' : ' (남은 재고: ' + ${opt.stockQuantity} + '개)')">
                </option>
            </select>
        </div>

        <!-- 3. 수량 입력 -->
        <div class="mb-3">
            <label for="count" class="form-label fw-bold">주문 수량</label>
            <input type="number" id="count" name="count" class="form-control" min="1" value="1" required onchange="checkQuantityInput()">
        </div>

        <!-- 버튼 클릭 시 /order/checkout 호출 -->
        <button type="submit" class="btn btn-primary w-100 py-2 mt-3" th:disabled="${options == null}">
            결제하기로 이동
        </button>
    </form>
</div>

<!-- Bootstrap JS (Alert 닫기 버튼 기능을 위함) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 재고 검증 자바스크립트 -->
<script>
    // 옵션 변경 시 max 속성 동적 변경
    function updateMaxStock() {
        const optionSelect = document.getElementById('optionSelect');
        const selectedOption = optionSelect.options[optionSelect.selectedIndex];
        const stock = parseInt(selectedOption.getAttribute('data-stock')) || 0;

        const countInput = document.getElementById('count');
        if (stock > 0) {
            countInput.max = stock;
        } else {
            countInput.removeAttribute('max');
        }
        checkQuantityInput();
    }

    // 수량 입력 변경 시 즉시 검증
    function checkQuantityInput() {
        const optionSelect = document.getElementById('optionSelect');
        if (!optionSelect || optionSelect.selectedIndex <= 0) return;

        const selectedOption = optionSelect.options[optionSelect.selectedIndex];
        const stock = parseInt(selectedOption.getAttribute('data-stock')) || 0;
        const countInput = document.getElementById('count');
        const count = parseInt(countInput.value) || 0;

        if (count > stock) {
            alert(`재고가 부족합니다. (현재 남은 재고: ${stock}개)`);
            countInput.value = stock; // 재고 최대 수량으로 자동 변경
        }
    }

    // 폼 제출 시 최종 재고 검증
    function validateStock() {
        const optionSelect = document.getElementById('optionSelect');
        const selectedOption = optionSelect.options[optionSelect.selectedIndex];
        const stock = parseInt(selectedOption.getAttribute('data-stock')) || 0;
        const count = parseInt(document.getElementById('count').value) || 0;

        if (count > stock) {
            alert(`주문 수량이 남은 재고(${stock}개)보다 많습니다.`);
            return false; // 폼 제출 중단
        }
        return true;
    }
</script>
</body>
</html>
