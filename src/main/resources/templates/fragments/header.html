<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- th:fragment="header" 속성으로 이 테그를 'header'라는 이름의 조각으로 정의 -->
<header th:fragment="header" class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
    <a href="/" class="text-dark text-decoration-none fs-3 fw-bold">🛒 Commerce Shop</a>

    <nav class="d-flex align-items-center gap-2">
        <a href="/items" class="btn btn-outline-secondary">상품목록</a>

        <!-- 비로그인 상태 -->
        <th:block th:if="${session.loginMember == null}">
            <a href="/login" class="btn btn-outline-primary">로그인</a>
            <a href="/members/new" class="btn btn-primary">회원가입</a>
        </th:block>

        <!-- 로그인 상태 -->
        <th:block th:if="${session.loginMember != null}">
            <span class="fw-bold me-2" th:text="${session.loginMember.name} + '님'"></span>

            <!-- 👑 로그인 사용자의 Role이 ADMIN인 경우에만 관리자 모드 버튼 노출 -->
            <a th:if="${session.loginMember.role == T(shopping.shop.domain.Role).ADMIN}"
               href="/admin" class="btn btn-warning fw-bold">⚙️ 관리자 모드</a>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-outline-danger">로그아웃</button>
            </form>
        </th:block>
    </nav>
</header>

</body>
</html>
