<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 및 재고 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .stock-badge { font-size: 0.85em; }
    </style>
</head>
<body class="container py-4">

<h2 class="mb-4">📦 상품 및 옵션 재고 목록</h2>

<!-- 검색 폼 -->
<form th:action="@{/items}" method="get" class="row g-3 mb-4">
    <div class="col-auto">
        <input type="text" name="searchQuery" th:value="${searchQuery}"
               class="form-control" placeholder="상품명 검색...">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary mb-3">검색</button>
    </div>
</form>

<!-- 상품 테이블 -->
<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th style="width: 10%;">ID</th>
        <th style="width: 30%;">상품명</th>
        <th style="width: 20%;">가격</th>
        <th style="width: 40%;">옵션별 남은 재고</th>
    </tr>
    </thead>
    <tbody>
    <!-- 검색 결과가 없을 때 -->
    <tr th:if="${#lists.isEmpty(items)}">
        <td colspan="4" class="text-center text-muted py-4">
            등록되거나 검색된 상품이 없습니다.
        </td>
    </tr>

    <!-- 상품 목록 출력 -->
    <tr th:each="item : ${items}">
        <td th:text="${item?.id}">1</td>
        <td class="fw-bold" th:text="${item?.name}">샘플 상품명</td>
        <td th:text="${#numbers.formatInteger(item?.price, 0, 'COMMA') + '원'}">10,000원</td>
        <td>
            <!-- 옵션 목록 루프 -->
            <div th:if="${item?.options != null and !#lists.isEmpty(item.options)}" class="d-flex flex-wrap gap-1">
                        <span th:each="option : ${item.options}"
                              class="badge rounded-pill p-2 stock-badge"
                              th:classappend="${option.stockQuantity > 0} ? 'bg-secondary' : 'bg-danger'">

                            <span th:text="${option.optionName}">M</span>:
                            <span th:if="${option.stockQuantity > 0}" th:text="${option.stockQuantity + '개'}">10개</span>
                            <span th:if="${option.stockQuantity <= 0}">품절</span>
                        </span>
            </div>

            <span th:if="${item?.options == null or #lists.isEmpty(item.options)}" class="text-muted small">
                        등록된 옵션 없음
                    </span>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
