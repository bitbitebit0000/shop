<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropFit - Item & Inventory List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/item/item-list.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container my-4">
    <h1 class="page-title">📦 Item & Inventory List</h1>

    <form th:action="@{/items}" method="get" class="row g-2 mb-4">
        <div class="col-auto">
            <input type="text" name="searchQuery" th:value="${searchQuery}"
                   class="form-control" placeholder="Search item name...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-search-dark px-3">Search</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle border">
            <thead>
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 30%;">Item Name</th>
                <th style="width: 20%;">Price</th>
                <th style="width: 40%;">Stock by Option</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="4" class="text-center text-muted py-5">
                    No items found or registered.
                </td>
            </tr>

            <tr th:each="item : ${items}">
                <td th:text="${item?.id}">1</td>
                <td class="fw-bold" th:text="${item?.name}">Sample Item Name</td>
                <td th:text="${'$' + #numbers.formatInteger(item?.price, 0, 'COMMA')}">$10,000</td>
                <td>
                    <div th:if="${item?.options != null and !#lists.isEmpty(item.options)}" class="d-flex flex-wrap gap-1">
                        <span th:each="option : ${item.options}"
                              class="badge rounded-pill px-2 py-1 stock-badge"
                              th:classappend="${option.stockQuantity > 0} ? 'bg-secondary' : 'bg-danger'">

                            <span th:text="${option.optionName}">M</span>:
                            <span th:if="${option.stockQuantity > 0}" th:text="${option.stockQuantity + ' pcs'}">10 pcs</span>
                            <span th:if="${option.stockQuantity <= 0}">Sold Out</span>
                        </span>
                    </div>

                    <span th:if="${item?.options == null or #lists.isEmpty(item.options)}" class="text-muted small">
                        No options registered
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer>
    <p>© 2026 <strong>DropFit</strong>. All rights reserved.</p>
    <p style="font-size: 0.8rem; color: var(--sub-text); margin-top: 0.25rem;">
        Powered by Spring Boot, Spring Data JPA, Thymeleaf & MySQL
    </p>
</footer>

</body>
</html>
