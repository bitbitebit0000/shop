<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropFit - Sign In</title>

    <link rel="stylesheet" href="/css/member/login.css">
</head>
<body>

<header>
    <a href="/" class="logo">DropFit</a>
    <nav>
        <a href="/items">Products</a>
        <a href="/signup">Sign Up</a>
    </nav>
</header>

<main class="login-wrapper">
    <div class="login-card">
        <h1 class="login-title">Login</h1>
        <p class="login-subtitle">Please log in to use DropFit services.</p>

        <div th:if="${loginError}" style="color: #ff3366; font-size: 0.9rem; margin-bottom: 1rem; text-align: center; font-weight: 500;" th:text="${loginError}">
            Invalid email or password.
        </div>

        <form action="/login" method="post">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-input" placeholder="Enter your email" required name="email" value="">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter your password" required name="password" value="">
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="login-footer">
            Don't have an account? <a href="/signup">Sign Up</a>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 <strong>DropFit</strong>. All rights reserved.</p>
    <p style="font-size: 0.8rem; color: var(--sub-text); margin-top: 0.25rem;">
        Powered by Spring Boot, Spring Data JPA, Thymeleaf & MySQL
    </p>
</footer>

</body>
</html>
