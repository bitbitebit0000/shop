# 1. 공통 기본 설정
spring:
  profiles:
    active: local

# 카카오페이 및 AWS S3 공통 설정 (들여쓰기 정돈)
kakao:
  pay:
    admin-key: ${KAKAO_ADMIN_KEY:08ca6cf208732644b8bf804b540db9dd}
    cid: TC0ONETIME

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY:YOUR_AWS_SECRET_KEY}
    s3:
      bucket: my-shop-bucket-name
    region:
      static: ap-northeast-2
    stack:
      auto: false  # 로컬 실행 시 CloudFormation 자동 조회 비활성화

---
# 2. 로컬(local) 전용 설정 -> H2 데이터베이스
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:~/my-awesome-project;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true
        format_sql: true

---
# 3. 운영(prod) 전용 설정 -> PostgreSQL
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect       # 사용 중인 리전 (예: 서울)